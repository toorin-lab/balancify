version: '3.8'

services:
  # Stateless Load Balancer
  load-balancer-stateless:
    build:
      context: .
      dockerfile: Dockerfile.lb-stateless
    container_name: load-balancer-stateless
    ports:
      - "8080:8080"
    environment:
      - SERVER_COUNT=3
      - SERVER_1_HOST=server-1
      - SERVER_1_PORT=5000
      - SERVER_1_CAPACITY=30
      - SERVER_2_HOST=server-2
      - SERVER_2_PORT=5000
      - SERVER_2_CAPACITY=30
      - SERVER_3_HOST=server-3
      - SERVER_3_PORT=5000
      - SERVER_3_CAPACITY=30
      - LB_PORT=8080
      - DEBUG=False
    networks:
      - lb-network
    depends_on:
      - server-1
      - server-2
      - server-3
    restart: unless-stopped

  # Server 1
  server-1:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: server-1-stateless
    environment:
      - SERVER_NAME=server-1
      - SERVER_PORT=5000
      - DEBUG=False
    networks:
      - lb-network
    restart: unless-stopped

  # Server 2
  server-2:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: server-2-stateless
    environment:
      - SERVER_NAME=server-2
      - SERVER_PORT=5000
      - DEBUG=False
    networks:
      - lb-network
    restart: unless-stopped

  # Server 3
  server-3:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: server-3-stateless
    environment:
      - SERVER_NAME=server-3
      - SERVER_PORT=5000
      - DEBUG=False
    networks:
      - lb-network
    restart: unless-stopped

  # Server Monitor 1
  server-monitor-1:
    build:
      context: .
      dockerfile: Dockerfile.server-monitor
    container_name: server-monitor-1-stateless
    environment:
      - SERVER_NAME=server-1
      - SERVER_HOST=server-1
      - SERVER_PORT=5000
      - LOAD_BALANCER_URL=http://load-balancer-stateless:8080
      - MONITORING_INTERVAL=5
    depends_on:
      - server-1
      - load-balancer-stateless
    networks:
      - lb-network
    restart: unless-stopped

  # Server Monitor 2
  server-monitor-2:
    build:
      context: .
      dockerfile: Dockerfile.server-monitor
    container_name: server-monitor-2-stateless
    environment:
      - SERVER_NAME=server-2
      - SERVER_HOST=server-2
      - SERVER_PORT=5000
      - LOAD_BALANCER_URL=http://load-balancer-stateless:8080
      - MONITORING_INTERVAL=5
    depends_on:
      - server-2
      - load-balancer-stateless
    networks:
      - lb-network
    restart: unless-stopped

  # Server Monitor 3
  server-monitor-3:
    build:
      context: .
      dockerfile: Dockerfile.server-monitor
    container_name: server-monitor-3-stateless
    environment:
      - SERVER_NAME=server-3
      - SERVER_HOST=server-3
      - SERVER_PORT=5000
      - LOAD_BALANCER_URL=http://load-balancer-stateless:8080
      - MONITORING_INTERVAL=5
    depends_on:
      - server-3
      - load-balancer-stateless
    networks:
      - lb-network
    restart: unless-stopped

  # Client
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: client-stateless
    environment:
      - LOAD_BALANCER_URL=http://load-balancer-stateless:8080
      - TEST_DURATION=300
      - TRAFFIC_PATTERN=burst
      - REQUEST_INTERVAL=0.5
      - BURST_SIZE=30
      - QUIET_PERIOD=2.0
    depends_on:
      - load-balancer-stateless
    networks:
      - lb-network
    restart: unless-stopped

networks:
  lb-network:
    driver: bridge
